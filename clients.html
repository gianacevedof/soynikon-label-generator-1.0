<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/styles.css" />
    <script
      src="https://kit.fontawesome.com/197e9f07b4.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <title>Soynikon | Label Generator</title>
  </head>

  <body>
    <!-- header -->
    <header class="sticky-top text-center">
      <div>
        <nav class="navbar navbar-expand-md">
          <div class="container-fluid m-1">
            <a class="navbar-brand" href="index.html">
              <div>
                <img
                  src="assets/images/logo-3.png"
                  alt="Logo for Soynikon Photo Store"
                />
              </div>
            </a>

            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNavAltMarkup"
              aria-controls="navbarNavAltMarkup"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
              <div class="navbar-nav fw-bold">
                <a class="nav-link" href="index.html">Create Label</a>
                <a class="nav-link" href="new.html">New Client</a>
                <a class="nav-link" href="clients.html">Current Clients</a>
                <a class="nav-link disabled" href="orders.html">Orders</a>
                <a class="nav-link disabled">Settings</a>
              </div>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <section id="clients">
      <h1 class="display-1 fw-bold">Clients Management</h1>
      <p class="text-secondary fw-light">View, edit or delete clients.</p>

      <div class="container mt-5 rounded">
        <table onload="app()" class="table" id="table">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">First</th>
              <th scope="col">Last</th>
              <th scope="col">Phone</th>
              <th scope="col">Address</th>
              <th scope="col">Apartment</th>
              <th scope="col">City</th>
              <th scope="col">State</th>
              <th scope="col">Zip</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btns mt-4">Save</button>
        <button type="submit" class="btn btn2 btn-outline-warning mt-4">
          Discard
        </button>
      </div>
    </section>

    <!-- footer -->
    <footer class="text-white p-4">
      <p>© 2026 Soynikon</p>
      <div>
        <a href="http://wa.me/18098664326" target="_blank"
          ><i class="fa-brands fa-whatsapp"></i
        ></a>
        <a href="https://www.instagram.com/soynikon" target="_blank"
          ><i class="fa-brands fa-instagram"></i
        ></a>
        <a href="https://www.facebook.com/soynikon.do" target="_blank"
          ><i class="fa-brands fa-facebook"></i
        ></a>
      </div>
    </footer>

    <script src="assets/js/get_clients.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

</html>
